<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="bg" x1="80" y1="40" x2="720" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A" />
      <stop offset="0.5" stop-color="#0F1F38" />
      <stop offset="1" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="accentPurple" x1="160" y1="120" x2="640" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6" />
      <stop offset="1" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="bubbleSender" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#6D28D9" />
      <stop offset="1" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="shadow" x="120" y="100" width="560" height="420" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" rx="24" fill="url(#bg)"/>
  <circle cx="120" cy="120" r="85" fill="#8B5CF6" opacity="0.10"/>
  <circle cx="680" cy="130" r="100" fill="#EC4899" opacity="0.08"/>
  <circle cx="700" cy="480" r="130" fill="#06B6D4" opacity="0.08"/>
  <circle cx="110" cy="490" r="90" fill="#10B981" opacity="0.08"/>

  <!-- Main Container -->
  <g filter="url(#shadow)" transform="translate(92,78)">
    <rect x="0" y="0" width="616" height="444" rx="28" fill="#0D1527" opacity="0.94" stroke="#334155" stroke-width="1.5"/>

    <!-- App Title Header inside mockup -->
    <g transform="translate(36,34)">
      <text x="0" y="0" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">ChatFlix</text>
      <text x="0" y="34" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="15">MERN Stack Real-Time Chat Application</text>
    </g>

    <!-- Chat App Layout -->
    <g transform="translate(36,94)">
      <!-- Outer Border -->
      <rect x="0" y="0" width="544" height="272" rx="22" fill="#111827" stroke="#1F2937" stroke-width="1.25"/>

      <!-- Left Sidebar (Conversations) -->
      <g transform="translate(0, 0)">
        <path d="M22 0 h142 v272 h-142 a22 22 0 0 1 -22 -22 v-228 a22 22 0 0 1 22 -22 Z" fill="#1F2937" opacity="0.5"/>
        <line x1="164" y1="0" x2="164" y2="272" stroke="#374151" stroke-width="1.25"/>

        <!-- Sidebar Header (Search) -->
        <rect x="14" y="16" width="136" height="26" rx="13" fill="#111827" stroke="#374151" stroke-width="1"/>
        <circle cx="28" cy="29" r="4" stroke="#94A3B8" stroke-width="1.2"/>
        <line x1="31" y1="32" x2="36" y2="37" stroke="#94A3B8" stroke-width="1.2"/>
        <text x="44" y="33" fill="#6B7280" font-family="Arial, Helvetica, sans-serif" font-size="11">Search chats...</text>

        <!-- Sidebar Conversation Items -->
        <!-- Chat Item 1 (Active) -->
        <g transform="translate(10, 56)">
          <rect x="0" y="0" width="144" height="42" rx="12" fill="#312E81" opacity="0.6" stroke="#4F46E5" stroke-width="1"/>
          <circle cx="22" cy="21" r="13" fill="#8B5CF6"/>
          <text x="17" y="25" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">JD</text>
          <circle cx="32" cy="31" r="4" fill="#10B981" stroke="#312E81" stroke-width="1"/>
          
          <text x="44" y="17" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">John Doe</text>
          <text x="44" y="30" fill="#818CF8" font-family="Arial, Helvetica, sans-serif" font-size="9">Online</text>
        </g>

        <!-- Chat Item 2 -->
        <g transform="translate(10, 106)">
          <circle cx="22" cy="21" r="13" fill="#EC4899"/>
          <text x="17" y="25" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">SA</text>
          <circle cx="32" cy="31" r="4" fill="#9CA3AF" stroke="#1F2937" stroke-width="1"/>
          
          <text x="44" y="17" fill="#E5E7EB" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">Sarah Al...</text>
          <text x="44" y="30" fill="#9CA3AF" font-family="Arial, Helvetica, sans-serif" font-size="9">Offline</text>
        </g>

        <!-- Chat Item 3 -->
        <g transform="translate(10, 156)">
          <circle cx="22" cy="21" r="13" fill="#F59E0B"/>
          <text x="17" y="25" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">MK</text>
          <circle cx="32" cy="31" r="4" fill="#10B981" stroke="#1F2937" stroke-width="1"/>
          
          <text x="44" y="17" fill="#E5E7EB" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">Mike King</text>
          <text x="44" y="30" fill="#9CA3AF" font-family="Arial, Helvetica, sans-serif" font-size="9">Typing...</text>
        </g>

        <!-- Chat Item 4 -->
        <g transform="translate(10, 206)">
          <circle cx="22" cy="21" r="13" fill="#10B981"/>
          <text x="17" y="25" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">AG</text>
          
          <text x="44" y="17" fill="#E5E7EB" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">Alex Green</text>
          <text x="44" y="30" fill="#9CA3AF" font-family="Arial, Helvetica, sans-serif" font-size="9">Away</text>
        </g>
      </g>

      <!-- Right Main Chat Window -->
      <g transform="translate(164, 0)">
        <!-- Chat Header -->
        <rect x="0" y="0" width="380" height="46" rx="0" fill="#1F2937" opacity="0.3"/>
        <line x1="0" y1="46" x2="380" y2="46" stroke="#374151" stroke-width="1.25"/>
        
        <circle cx="24" cy="23" r="13" fill="#8B5CF6"/>
        <text x="19" y="27" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">JD</text>
        <circle cx="34" cy="31" r="4" fill="#10B981" stroke="#111827" stroke-width="1"/>
        
        <text x="46" y="21" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">John Doe</text>
        <text x="46" y="33" fill="#9CA3AF" font-family="Arial, Helvetica, sans-serif" font-size="9">Active now</text>

        <!-- Chat Controls Icons -->
        <g transform="translate(290, 14)">
          <!-- Video Icon -->
          <rect x="0" y="2" width="12" height="10" rx="2" fill="#9CA3AF"/>
          <polygon points="12,4 17,1 17,13 12,10" fill="#9CA3AF"/>
          <!-- Phone Icon -->
          <path d="M26,3 A2,2 0 0,0 24,5 C24,10 28,14 33,14 A2,2 0 0,0 35,12 L34,10 A1,1 0 0,0 32,10 L31,11 A5,5 0 0,1 27,7 L28,6 A1,1 0 0,0 28,4 Z" fill="#9CA3AF"/>
          <!-- Dots Icon -->
          <circle cx="48" cy="7" r="1.8" fill="#9CA3AF"/>
          <circle cx="54" cy="7" r="1.8" fill="#9CA3AF"/>
          <circle cx="60" cy="7" r="1.8" fill="#9CA3AF"/>
        </g>

        <!-- Message History -->
        <g transform="translate(16, 62)">
          <!-- Message 1 (Left - Received) -->
          <g transform="translate(0, 0)">
            <rect x="0" y="0" width="220" height="34" rx="12" fill="#1F2937" stroke="#374151" stroke-width="0.75"/>
            <text x="12" y="20" fill="#E5E7EB" font-family="Arial, Helvetica, sans-serif" font-size="11">Hey! Did you check the new ChatFlix UI?</text>
            <text x="228" y="28" fill="#4B5563" font-family="Arial, Helvetica, sans-serif" font-size="8">10:42 AM</text>
          </g>

          <!-- Message 2 (Right - Sent) -->
          <g transform="translate(100, 46)">
            <rect x="0" y="0" width="248" height="34" rx="12" fill="url(#bubbleSender)"/>
            <text x="12" y="20" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">Yes! The Socket.IO real-time sync is fast!</text>
            <text x="-48" y="28" fill="#4B5563" font-family="Arial, Helvetica, sans-serif" font-size="8">10:43 AM</text>
          </g>

          <!-- Message 3 (Left - Received) -->
          <g transform="translate(0, 92)">
            <rect x="0" y="0" width="180" height="34" rx="12" fill="#1F2937" stroke="#374151" stroke-width="0.75"/>
            <text x="12" y="20" fill="#E5E7EB" font-family="Arial, Helvetica, sans-serif" font-size="11">Awesome! Let's deploy to Vercel. 🚀</text>
            <text x="188" y="28" fill="#4B5563" font-family="Arial, Helvetica, sans-serif" font-size="8">10:43 AM</text>
          </g>
        </g>

        <!-- Message Input Field -->
        <g transform="translate(16, 218)">
          <rect x="0" y="0" width="348" height="34" rx="17" fill="#111827" stroke="#374151" stroke-width="1.25"/>
          <text x="16" y="21" fill="#4B5563" font-family="Arial, Helvetica, sans-serif" font-size="11">Type a message...</text>
          
          <!-- Send Button Icon -->
          <circle cx="328" cy="17" r="12" fill="#4F46E5"/>
          <path d="M324,17 L330,17 M328,14 L331,17 L328,20" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>
    </g>

    <!-- Bottom Info / Badges -->
    <g transform="translate(36,392)">
      <rect x="0" y="0" width="544" height="28" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="16" y="19" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="13">MERN Stack • Socket.IO • Tailwind CSS • JWT Auth • Scalable Backend</text>
    </g>
  </g>
</svg>
